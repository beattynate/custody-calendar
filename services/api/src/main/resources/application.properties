spring.application.name=custody-calendar-api
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/custody_calendar}
spring.datasource.username=${DB_USERNAME:custody}
spring.datasource.password=${DB_PASSWORD:custody}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8080/dev/jwks}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.solver.defaults.constraints.min-run-days=2
app.solver.defaults.constraints.compensation-window-days=60
app.solver.defaults.constraints.respect-locked=true
app.solver.defaults.weights.transition-penalty=50
app.solver.defaults.weights.school-night-transition-penalty=30
app.solver.defaults.weights.parity-drift-penalty=40
app.solver.defaults.weights.locked-proximity-penalty=100
app.solver.defaults.weights.owed-imbalance-penalty=5
app.solver.defaults.weights.run-days-over-three-penalty=10

app.security.dev-jwks.enabled=true
app.security.dev-jwks.path=${user.dir}/../../dev/jwt/jwks.json
app.cors.allowed-origins=http://localhost:5173

app.solver.school-night.start-date=2025-08-04
app.solver.school-night.end-date=2026-05-25
app.solver.school-night.days-of-week=MONDAY,TUESDAY,WEDNESDAY,THURSDAY
