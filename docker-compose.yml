services:
  postgres:
    image: postgres:16
    container_name: custody-calendar-postgres
    environment:
      POSTGRES_DB: custody_calendar
      POSTGRES_USER: custody
      POSTGRES_PASSWORD: custody
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U custody -d custody_calendar"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
